name: Android CI with Lint and UI Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-and-test:
    runs-on: macos-latest # Usamos macOS para que el emulador sea rápido

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Dar permisos de ejecución
      run: chmod +x gradlew

    # --- PASO 1: VERIFICACIÓN DE ESTILO ---
    - name: Run ktlint
      run: ./gradlew ktlintCheck

    # --- PASO 2: COMPILACIÓN ---
    - name: Build with Gradle
    拉 run: ./gradlew assembleDebug

    # --- PASO 3: TEST DE INTERFAZ (BOTÓN) ---
    - name: Run UI Tests (Button Check)
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 30
        arch: x86_64
        script: ./gradlew connectedAndroidTest
